<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e5a6b"><title>Cockpit</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>
/* Layout: a field tool. Sticky title bar, five bottom tabs, rows with one contextual timer button (green start, red stop, blue repeat), four tinted priority lists, a day timeline with a tray of unscheduled work. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e8eef1; --ink:#16212a; --muted:#55646f; --line:#d5dde2;
  --accent:#0e5a6b; --on-accent:#ffffff;
  --go:#16783f; --on-go:#ffffff; --stop:#bd2f27; --on-stop:#ffffff; --rep:#2457bd; --on-rep:#ffffff;
  --c-iu:#bd2f27; --c-u:#a8530a; --c-n:#58646e; --c-i:#2457bd;
  --t-iu:#fceeed; --t-u:#fdf1e4; --t-n:#edf1f3; --t-i:#eaf0fb;
  --tabh:60px; --shadow:0 1px 2px rgba(22,33,42,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1418; --surface:#172027; --surface2:#212c34; --ink:#e6edf1; --muted:#94a3ae; --line:#2b3842;
    --accent:#5ec0d6; --on-accent:#07232b;
    --go:#46c47f; --on-go:#06241a; --stop:#ff7d72; --on-stop:#3a0a06; --rep:#85a9ff; --on-rep:#0a1b45;
    --c-iu:#ff8a80; --c-u:#f2a45e; --c-n:#a9b5be; --c-i:#8fb0ff;
    --t-iu:#2b1816; --t-u:#2b1e11; --t-n:#1d252b; --t-i:#14203a;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#172027; --surface2:#212c34; --ink:#e6edf1; --muted:#94a3ae; --line:#2b3842;
  --accent:#5ec0d6; --on-accent:#07232b;
  --go:#46c47f; --on-go:#06241a; --stop:#ff7d72; --on-stop:#3a0a06; --rep:#85a9ff; --on-rep:#0a1b45;
  --c-iu:#ff8a80; --c-u:#f2a45e; --c-n:#a9b5be; --c-i:#8fb0ff;
  --t-iu:#2b1816; --t-u:#2b1e11; --t-n:#1d252b; --t-i:#14203a;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header and tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{margin:0;font-size:19px;letter-spacing:.01em}
.top .sub{color:var(--muted);font-size:13px;text-transform:capitalize}
.top .grow{flex:1;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;min-width:0}
.tab[aria-current="page"]{color:var(--accent);font-weight:650}
.tab svg{width:22px;height:22px}
.ibtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}

main{padding-top:14px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
main.with-tray{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + min(38vh,300px) + 20px)}
.h{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.h:first-child{margin-top:4px}
.n{font-weight:500;background:var(--surface2);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
.empty{color:var(--muted);margin:6px 0 0}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.notice.warn{border-color:var(--c-u)}

/* rows */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 4px;box-shadow:var(--shadow);cursor:pointer}
.row.is-done .rt{text-decoration:line-through;color:var(--muted)}
.row.is-plan{border-style:dashed}
.chk{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:15px;height:15px;stroke-width:3}
.rt{font-weight:600;overflow-wrap:anywhere}
.rtime{font-size:12.5px;color:var(--muted);margin-bottom:1px}
.rm{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.tag{background:var(--surface2);border-radius:6px;padding:1px 7px}
.pc{background:var(--t);color:var(--c);border-radius:6px;padding:1px 7px;font-weight:600}
.dur{font-weight:600;color:var(--ink)}
.racts{display:flex;gap:6px;align-items:center}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:84px;min-height:42px;padding:0 12px;border:0;border-radius:10px;font-size:13px;font-weight:700;letter-spacing:.04em}
.act-start{background:var(--go);color:var(--on-go)}
.act-stop{background:var(--stop);color:var(--on-stop)}
.act-rep{background:var(--rep);color:var(--on-rep)}
.mini{min-height:42px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.banner{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--go);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.banner small{display:block;color:var(--go);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.banner strong{display:block;overflow-wrap:anywhere}
.banner time{font-size:22px;font-weight:700}

/* filters */
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 16px;min-height:40px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:650}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.filters label,.field{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.filters select,.field input,.field select,.field textarea,.search{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
.search{margin-bottom:10px}
details.fd>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.grp{margin-top:6px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:15px}
.gd{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}

/* drag */
.grip{touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center;width:34px;min-height:34px;color:var(--muted);cursor:grab;flex:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.ghost{position:fixed;z-index:1000;pointer-events:none;max-width:70vw;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:650;box-shadow:0 6px 18px rgba(0,0,0,.28);transform:translate(-50%,-130%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop-over{outline:3px dashed var(--accent);outline-offset:-3px}
.card{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 2px;cursor:pointer}
.cb{min-width:0;flex:1}
.ct{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.cm{font-size:12px;color:var(--muted)}

/* priorities */
.q-iu{--c:var(--c-iu);--t:var(--t-iu)} .q-u{--c:var(--c-u);--t:var(--t-u)} .q-n{--c:var(--c-n);--t:var(--t-n)} .q-i{--c:var(--c-i);--t:var(--t-i)}
.quads{display:grid;gap:12px}
.quad{background:var(--t);border-left:6px solid var(--c);border-radius:12px;padding:10px 10px 12px;min-height:110px}
.quad h3{margin:0 0 8px;font-size:14.5px;color:var(--c);display:flex;gap:8px;align-items:center}
.quad h3 .n{background:var(--surface);color:var(--ink)}
.quad .list{gap:6px}
.quad .hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.tray{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border-top:2px solid var(--accent)}
.tray .in{padding-top:8px;padding-bottom:10px;max-height:min(38vh,300px);overflow:auto}
.tray h3{margin:0 0 6px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mboard{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.mcol{flex:0 0 min(78vw,290px);scroll-snap-align:start;background:var(--surface2);border-radius:12px;padding:8px}
.mcol h3{margin:2px 4px 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.mcol .list{gap:6px;min-height:50px}
@media (min-width:700px){.quads{grid-template-columns:1fr 1fr}.filters{grid-template-columns:repeat(3,1fr)}}

/* calendar */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wk b{flex:1;text-align:center;font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dbtn{display:grid;justify-items:center;gap:1px;padding:6px 0 4px;min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:12px;color:var(--muted)}
.dbtn .dn{font-size:17px;font-weight:700;color:var(--ink)}
.dbtn .dd{height:6px;display:flex;gap:2px}
.dbtn .dd i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dbtn[aria-pressed="true"] .dn{color:var(--on-accent)}
.dbtn[aria-pressed="true"] .dd i{background:var(--on-accent)}
.dbtn.today .dn{text-decoration:underline;text-underline-offset:3px}
.ad{display:grid;gap:6px;margin-bottom:10px}
.adb{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.adb.az{border-left-color:var(--rep)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{display:flex;align-items:center;flex:none;max-width:70vw;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:10px;padding:2px 12px 2px 0;font-size:13.5px;font-weight:600;cursor:pointer}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{position:relative;margin-left:44px;border-left:1px solid var(--line);background:var(--surface);border-radius:0 10px 10px 0}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr em{position:absolute;left:-44px;top:-9px;width:38px;text-align:right;font-style:normal;font-size:11.5px;color:var(--muted)}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--stop);z-index:3;pointer-events:none}
.blk{position:absolute;z-index:2;overflow:hidden;border-radius:8px;padding:3px 6px 3px 6px;font-size:12px;line-height:1.25;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);cursor:pointer;display:flex;gap:2px}
.blk.plan{background:var(--surface2);color:var(--ink);border:1.5px dashed var(--accent)}
.blk.run{background:var(--go);color:var(--on-go);border-color:var(--go)}
.blk .bt{min-width:0;flex:1}
.blk b{display:block;overflow:hidden;text-overflow:ellipsis}
.blk small{display:block;opacity:.85;font-size:11px}
.blk .grip{width:26px;min-height:26px;color:inherit}

/* sheet */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(8,14,18,.55)}
.panel{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2{margin:0 0 12px;font-size:18px}
.panel h3{margin:18px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field.full{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill span{display:flex;align-items:center;min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;font-size:14px;background:var(--surface)}
.pill input:checked+span{border-color:var(--c,var(--accent));background:var(--t,var(--surface2));color:var(--c,var(--ink));font-weight:650}
.pill input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dng{border-color:var(--stop);color:var(--stop)}
.btn.dng.armed{background:var(--stop);color:var(--on-stop)}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow span{flex:1}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
textarea{resize:vertical}
.fab{position:fixed;z-index:14;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fab svg{width:26px;height:26px}
.toast{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 80px);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>

var TABS=[['oggi','Oggi'],['att','Attività'],['prio','Priorità'],['cal','Calendario'],['ric','Ricorrenti']];

/* ---------- seed (dati iniziali da Notion) ---------- */
var A=[];
var R=[];
function seed(){
  var now=Date.now(),out=[];
  A.forEach(function(a,i){out.push(norm({id:'a'+(i+1),title:a[0],type:'azione',macro:a[1]||'',resp:a[2]||[],done:!!a[3],start:a[4]||null,prio:a[5]||null,created:now}))});
  R.forEach(function(r,i){out.push(norm({id:'r'+(i+1),title:r[0],type:'ricorrente',start:r[1],end:r[2]||null,created:now}))});
  return out;
}

/* ---------- state ---------- */
function norm(o){
  return {id:String(o.id||newId()),title:String(o.title||'Senza titolo'),type:o.type==='ricorrente'?'ricorrente':'azione',macro:o.macro||'',
    prio:PR[o.prio]?o.prio:null,resp:Array.isArray(o.resp)?o.resp.map(String):[],done:!!o.done,created:+o.created||Date.now(),
    start:o.start||null,end:o.end||null,note:o.note||'',
    sessions:Array.isArray(o.sessions)?o.sessions.filter(function(s){return s&&typeof s.s==='number'}).map(function(s){return {s:s.s,e:typeof s.e==='number'?s.e:null}}):[]};
}
function defUI(){return {tab:'oggi',list:'elenco',f:{done:'no',tipo:'azione',macro:'',prio:'',resp:'',q:''},fOpen:false,pm:'',ricAll:false,day:todayStr()}}
var saveOk=true,S=load();
function load(){
  var raw=null;try{raw=localStorage.getItem(K)}catch(e){}
  if(raw){try{var d=JSON.parse(raw);if(d&&Array.isArray(d.items)){var ui=Object.assign(defUI(),d.ui||{});ui.f=Object.assign(defUI().f,ui.f||{});ui.day=todayStr();return {items:d.items.map(norm),meta:d.meta||{},ui:ui}}}catch(e){}}
  return {items:seed(),meta:{seeded:Date.now()},ui:defUI()};
}
function save(){
  try{var u=Object.assign({},S.ui);delete u.day;localStorage.setItem(K,JSON.stringify({v:1,items:S.items,meta:S.meta,ui:u}));saveOk=true}catch(e){saveOk=false}
}
function snapshotPrev(){try{localStorage.setItem(K+'.prev',JSON.stringify({at:Date.now(),items:S.items}))}catch(e){}}
function prevInfo(){try{var p=JSON.parse(localStorage.getItem(K+'.prev')||'null');return p&&Array.isArray(p.items)?p:null}catch(e){return null}}
var byId=function(id){return S.items.find(function(i){return i.id===id})};

/* ---------- logic ---------- */
function runningItem(){return S.items.find(function(i){return i.sessions.some(function(s){return s.e==null})})||null}
function isRunning(it){return it.sessions.some(function(s){return s.e==null})}
function totalMs(it){var n=Date.now();return it.sessions.reduce(function(t,s){return t+((s.e==null?n:s.e)-s.s)},0)}
function stopItem(it){var n=Date.now();it.sessions.forEach(function(s){if(s.e==null)s.e=n})}
function startItem(it){
  var r=runningItem(),msg;
  if(r&&r.id!==it.id){stopItem(r);msg='STOP su “'+r.title+'”. '}
  if(!isRunning(it))it.sessions.push({s:Date.now(),e:null});
  it.done=false;
  toast((msg||'')+(it.sessions.length>1?'REP':'START')+': '+it.title);
}
function macroList(){var x=MACROS.slice();S.items.forEach(function(i){if(i.macro&&x.indexOf(i.macro)<0)x.push(i.macro)});return x}
function respList(){var x=[];S.items.forEach(function(i){i.resp.forEach(function(r){if(x.indexOf(r)<0)x.push(r)})});return x.sort()}
function byStart(a,b){return (a.done-b.done)||((a.start||'9999')<(b.start||'9999')?-1:(a.start||'9999')>(b.start||'9999')?1:0)||a.title.localeCompare(b.title,'it')}
function byPrio(a,b){var x=PW[a.prio],y=PW[b.prio];x=x==null?9:x;y=y==null?9:y;return (x-y)||a.macro.localeCompare(b.macro,'it')||a.title.localeCompare(b.title,'it')}
function dateText(it){
  if(!it.start)return '';
  var a=it.start,b=it.end,s=dfmt(a,DS)+(isTimed(a)?' '+a.slice(11,16):'');
  if(b&&b!==a){if(dayOf(b)===dayOf(a))s+='–'+b.slice(11,16);else s+=' → '+dfmt(b,DS)+(isTimed(b)?' '+b.slice(11,16):'')}
  return s;
}
function allDayFor(day){return S.items.filter(function(it){return it.start&&!isTimed(it.start)&&it.start<=day&&(it.end||it.start)>=day}).sort(function(a,b){return (a.type<b.type?1:-1)})}
function dayBlocks(day){
  var out=[];
  S.items.forEach(function(it){
    if(it.sessions.length){it.sessions.forEach(function(s,i){if(ymd(new Date(s.s))===day)out.push({it:it,kind:'sess',i:i,s:s.s,e:s.e})})}
    else if(it.start&&isTimed(it.start)&&dayOf(it.start)===day){
      var s=parseDT(it.start).getTime(),e=it.end&&isTimed(it.end)?parseDT(it.end).getTime():s+36e5;if(e<=s)e=s+36e5;
      out.push({it:it,kind:'plan',s:s,e:e});
    }
  });
  return out.sort(function(a,b){return a.s-b.s});
}
function planDurMin(it){if(it.start&&it.end&&isTimed(it.start)&&isTimed(it.end)){var d=(parseDT(it.end)-parseDT(it.start))/6e4;if(d>0)return d}return 60}
function setTimed(it,day,min){
  var dur=planDurMin(it);min=Math.max(TL0*60,Math.min(TL1*60-15,min));
  var e=Math.min(min+dur,23*60+59);
  it.start=day+'T'+pad(Math.floor(min/60))+':'+pad(min%60);it.end=day+'T'+pad(Math.floor(e/60))+':'+pad(e%60);
}
function moveToDay(it,day){
  if(!it.start){it.start=day;it.end=null;return}
  var n=dayDiff(dayOf(it.start),day);it.start=shift(it.start,n);if(it.end)it.end=shift(it.end,n);
}
function layout(bl){
  var out=bl.map(function(b){var c=Object.assign({},b);c.e2=b.e==null?Date.now():b.e;if(c.e2<=c.s)c.e2=c.s+9e5;return c});
  var cl=[],ce=0;
  function flush(){var n=Math.max.apply(null,cl.map(function(c){return c.lane}))+1;cl.forEach(function(c){c.lanes=n});cl=[]}
  out.forEach(function(b){
    if(cl.length&&b.s>=ce){flush();ce=0}
    var used=cl.filter(function(c){return c.e2>b.s}).map(function(c){return c.lane}),l=0;while(used.indexOf(l)>=0)l++;
    b.lane=l;cl.push(b);ce=Math.max(ce,b.e2);
  });
  if(cl.length)flush();
  return out;
}
function filtered(){
  var f=S.ui.f,q=f.q.trim().toLowerCase();
  return S.items.filter(function(it){
    return (f.done==='all'||(f.done==='no'?!it.done:it.done))&&(!f.tipo||it.type===f.tipo)&&(!f.macro||it.macro===f.macro)
      &&(!f.prio||(f.prio==='-'?!it.prio:it.prio===f.prio))&&(!f.resp||it.resp.indexOf(f.resp)>=0)
      &&(!q||it.title.toLowerCase().indexOf(q)>=0||(it.note||'').toLowerCase().indexOf(q)>=0);
  });
}
function groupBy(a,fn){var g={};a.forEach(function(x){var k=fn(x);(g[k]=g[k]||[]).push(x)});return g}

}

/* ---------- export / import ---------- */
function payload(){return JSON.stringify({app:'cockpit',version:1,exported:new Date().toISOString(),items:S.items},null,1)}
function markExport(){S.meta.lastExport=Date.now();refresh()}
function saveFile(name,text,type){
  var file=new File([text],name,{type:type});
  return Promise.resolve().then(function(){
    if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:name}).then(function(){markExport();toast('Condiviso: '+name)});
    throw 0;
  }).catch(function(e){
    if(e&&e.name==='AbortError')return;
    var a=document.createElement('a'),u=URL.createObjectURL(file);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
    markExport();toast('File preparato. Se non si salva, usa “Copia dati”.');
  });
}
function csvText(){
  var q=function(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var head=['Attività','Tipo','Macro','Priorità','Responsabile','Fatto','Data inserimento','Inizio','Fine','Durata registrata (min)','Note'];
  var rows=S.items.map(function(i){return [i.title,i.type,i.macro,i.prio?PR[i.prio].n:'',i.resp.join(', '),i.done?'sì':'no',ymd(new Date(i.created)),i.start||'',i.end||'',Math.round(totalMs(i)/6e4),i.note].map(q).join(',')});
  return '﻿'+[head.map(q).join(',')].concat(rows).join('\n');
}
function copyText(text){
  var fb=function(){var t=$('#imptxt');if(t){t.value=text;t.focus();t.select();toast('Seleziona e copia il testo qui sotto.')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){markExport();toast('Dati copiati negli appunti')},fb);else fb();
}
function importText(text,mode){
  var d;try{d=JSON.parse(text)}catch(e){toast('Il testo non è un backup valido.');return}
  var arr=Array.isArray(d)?d:d&&d.items;
  if(!Array.isArray(arr)||!arr.length||!arr.every(function(x){return x&&typeof x.title==='string'})){toast('Nessuna attività riconosciuta nel backup.');return}
  var items=arr.map(norm);snapshotPrev();
  if(mode==='replace')S.items=items;
  else{var m={};S.items.forEach(function(i){m[i.id]=i});items.forEach(function(i){m[i.id]=i});S.items=Object.keys(m).map(function(k){return m[k]})}
  refresh();toast('Importate '+items.length+' attività');
}

/* ---------- actions ---------- */
function act(a,el){
  var id=el.dataset.id,it=id?byId(id):null;
  switch(a){
    case 'tab':S.ui.tab=el.dataset.v;save();render();window.scrollTo(0,0);if(S.ui.tab==='cal')scrollCal();break;
    case 'mode':S.ui.list=el.dataset.v;refresh();break;
    case 'done':if(it){if(!it.done&&isRunning(it))stopItem(it);it.done=!it.done;refresh()}break;
    case 'start':case 'rep':if(it){startItem(it);refresh()}break;
    case 'stop':if(it){stopItem(it);refresh();toast('STOP: '+it.title+' · '+fmtDur(totalMs(it)/6e4))}break;
    case 'today':if(it){it.start=todayStr();it.end=null;refresh()}break;
    case 'edit':openEdit(id);break;
    case 'new':openEdit(null,{type:S.ui.tab==='ric'?'ricorrente':'azione'});break;
    case 'close':closeSheet();break;
    case 'data':openSheet({type:'data'});break;
    case 'wk':S.ui.day=el.dataset.v==='0'?todayStr():addDays(S.ui.day,+el.dataset.v);refresh();break;
    case 'day':S.ui.day=el.dataset.d;refresh();break;
    case 'save':saveEdit();break;
    case 'delsess':readForm();var ci=curSheet.draft.id&&byId(curSheet.draft.id);if(ci){ci.sessions.splice(+el.dataset.i,1);refresh()}break;
    case 'del':readForm();var di=curSheet.draft.id;if(di&&arm('del:'+di)){S.items=S.items.filter(function(x){return x.id!==di});closeSheet();refresh();toast('Attività eliminata')}else renderSheet();break;
    case 'plus1y':var pi=byId(curSheet.draft.id);if(pi){var c=norm(Object.assign({},pi,{id:newId(),start:plusYear(pi.start),end:pi.end?plusYear(pi.end):null,sessions:[],done:false,created:Date.now()}));S.items.push(c);closeSheet();refresh();toast('Creata: '+c.title+' ('+dfmt(c.start,DS)+')')}break;
    case 'ricrep':if(arm('ricrep')){var ps=pastNoCopy();ps.forEach(function(i){S.items.push(norm(Object.assign({},i,{id:newId(),start:plusYear(i.start),end:i.end?plusYear(i.end):null,sessions:[],done:false,created:Date.now()})))});refresh();toast('Create '+ps.length+' copie')}else render();break;
    case 'exp-json':saveFile('cockpit-'+todayStr()+'.json',payload(),'application/json');break;
    case 'exp-csv':saveFile('cockpit-'+todayStr()+'.csv',csvText(),'text/csv');break;
    case 'exp-copy':copyText(payload());break;
    case 'imp-txt':var txt=($('#imptxt')||{}).value||'',md=(document.querySelector('input[name=imp]:checked')||{}).value||'merge';
      if(!txt.trim()){toast('Incolla prima il testo del backup.');break}
      if(md==='replace'&&!arm('imp')){renderSheet();break}
      importText(txt,md);closeSheet();break;
    case 'undoimp':var pv=prevInfo();if(pv){S.items=pv.items.map(norm);refresh();toast('Ripristinato lo stato precedente')}break;
    case 'reset':if(arm('reset')){snapshotPrev();S.items=seed();S.meta.seeded=Date.now();closeSheet();refresh();toast('Tutte le attività cancellate')}else renderSheet();break;
  }
}
function saveEdit(){
  readForm();var d=curSheet.draft;
  var title=d.title.trim();if(!title){toast('Scrivi un titolo.');return}
  var start=d.sd?d.sd+(d.st?'T'+d.st:''):null,end=null;
  if(start){if(d.ed)end=d.ed+(d.et?'T'+d.et:'');else if(d.st&&d.et)end=d.sd+'T'+d.et}
  if(!start&&(d.ed||d.st||d.et)){toast('Imposta il giorno di inizio.');return}
  if(start&&end&&parseDT(end)<parseDT(start)){toast('La fine è prima dell’inizio.');return}
  var resp=d.resp.slice(),nr=(d.newresp||'').trim();if(nr&&resp.indexOf(nr)<0)resp.push(nr);
  var it=d.id?byId(d.id):null;
  if(!it){it=norm({id:newId(),created:Date.now()});S.items.push(it)}
  Object.assign(it,{title:title,type:d.type,macro:d.macro,prio:d.prio,resp:resp,done:d.done,note:d.note,start:start,end:end});
  if(it.done&&isRunning(it))stopItem(it);
  closeSheet();refresh();toast('Salvato');
}
function scrollCal(){
  if(S.ui.day!==todayStr())return;
  var tl=$('#tl');if(!tl)return;
  var n=new Date(),y=tl.getBoundingClientRect().top+window.scrollY+(Math.max(n.getHours()-1,TL0)-TL0)*PXH-180;
  window.scrollTo(0,Math.max(0,y));
}

/* ---------- drag and drop (pointer events: mouse and touch) ---------- */
var dragging=null,dragTimer=null;
function moveGhost(e){var g=dragging.ghost;g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}
function dropAt(x,y){var el=document.elementFromPoint(x,y);return el?el.closest('[data-drop]'):null}
function endDrag(){
  if(!dragging)return;
  clearInterval(dragTimer);dragTimer=null;
  dragging.ghost.remove();$$('.drop-over').forEach(function(x){x.classList.remove('drop-over')});
  document.body.classList.remove('dragging');dragging=null;
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('[data-drag]');
  if(!g||(e.pointerType==='mouse'&&e.button!==0))return;
  var it=byId(g.dataset.drag);if(!it)return;
  e.preventDefault();
  var gh=document.createElement('div');gh.className='ghost';gh.textContent=it.title;document.body.appendChild(gh);
  dragging={id:it.id,ghost:gh,pid:e.pointerId,x:e.clientX,y:e.clientY,over:null};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  document.body.classList.add('dragging');moveGhost(e);
  dragTimer=setInterval(function(){
    if(!dragging)return;var y=dragging.y,x=dragging.x;
    if(y<90)window.scrollBy(0,-14);else if(y>window.innerHeight-130&&S.ui.tab!=='prio')window.scrollBy(0,14);
    var mb=$('#mboard');if(mb){var r=mb.getBoundingClientRect();if(y>r.top&&y<r.bottom){if(x<r.left+50)mb.scrollLeft-=14;else if(x>r.right-50)mb.scrollLeft+=14}}
  },16);
});
document.addEventListener('pointermove',function(e){
  if(!dragging||e.pointerId!==dragging.pid)return;
  dragging.x=e.clientX;dragging.y=e.clientY;moveGhost(e);
  var d=dropAt(e.clientX,e.clientY);
  if(d!==dragging.over){if(dragging.over)dragging.over.classList.remove('drop-over');if(d)d.classList.add('drop-over');dragging.over=d}
});
document.addEventListener('pointerup',function(e){
  if(!dragging||e.pointerId!==dragging.pid)return;
  var id=dragging.id,d=dropAt(e.clientX,e.clientY),y=e.clientY;
  endDrag();
  if(d)handleDrop(id,d,y);
});
document.addEventListener('pointercancel',function(e){if(dragging&&e.pointerId===dragging.pid)endDrag()});
function handleDrop(id,el,y){
  var it=byId(id);if(!it)return;
  var k=el.dataset.drop,i=k.indexOf(':'),kind=k.slice(0,i),val=k.slice(i+1);
  if(kind==='prio'){it.prio=val==='none'?null:val;toast(it.title+' → '+(it.prio?PR[it.prio].n:'Da classificare'))}
  else if(kind==='macro'){it.macro=val==='-'?'':val;toast(it.title+' → '+(it.macro||'Senza macro'))}
  else if(kind==='day'){moveToDay(it,val);toast(it.title+' → '+dfmt(val,DS))}
  else if(kind==='tl'){var r=el.getBoundingClientRect(),min=Math.round(((y-r.top)/PXH*60+TL0*60)/15)*15;setTimed(it,val,min);toast(it.title+' → '+dayOf(it.start).slice(8)+'/'+dayOf(it.start).slice(5,7)+' '+it.start.slice(11,16))}
  refresh();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.closest('[data-drag]'))return;
  var el=e.target.closest('[data-a]');if(!el)return;
  e.stopPropagation();act(el.dataset.a,el);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.f){S.ui.f[t.dataset.f]=t.value;S.ui.fOpen=true;refresh()}
  else if(t.dataset.pm){S.ui.pm=t.value;refresh()}
  else if(t.dataset.ricall){S.ui.ricAll=t.checked;refresh()}
  else if(t.id==='impfile'&&t.files[0]){
    var md=(document.querySelector('input[name=imp]:checked')||{}).value||'merge',rd=new FileReader();
    rd.onload=function(){if(md==='replace'&&!arm('impf')){$('#imptxt').value=String(rd.result);toast('Testo caricato. Premi “Importa dal testo” per sostituire.');return}importText(String(rd.result),md);closeSheet()};
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.ui.f.q=e.target.value;save();var b=$('#listBody');if(b)b.innerHTML=listBody()}
});
document.addEventListener('toggle',function(e){if(e.target.id==='fd')S.ui.fOpen=e.target.open},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&curSheet)closeSheet()});
setInterval(function(){
  $$('[data-live]').forEach(function(el){var it=byId(el.dataset.live);if(it)el.textContent=hms(totalMs(it))});
},1000);
setInterval(function(){if(S.ui.tab==='cal'&&!dragging&&!curSheet&&runningItem())render()},60000);

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
save();render();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body></html>
