<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settimana Ideale - Cockpit Banner</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e5e4;
      --text: #37352f;
      --muted: #787774;
      --bar-bg: #efefee;
      --accent: #2383e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --border: #2f2f2f;
        --text: #ebebea;
        --muted: #9b9a97;
        --bar-bg: #2f2f2f;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--bg);
      border: none;
      padding: 0 18px;
      width: 100%;
      height: 100vh;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .current-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-time {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .center {
      flex: 1;
      max-width: 280px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .pct {
      font-size: 11px;
      color: var(--muted);
      min-width: 34px;
      text-align: right;
    }

    .right {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      text-align: right;
    }

    .right strong {
      color: var(--text);
      font-weight: 500;
    }

    @media (max-width: 640px) {
      .center { display: none; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <span class="dot" id="dot"></span>
      <span class="current-title" id="currentTitle">Caricamento...</span>
      <span class="current-time" id="currentTime"></span>
    </div>

    <div class="center">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="pct" id="pct">0%</span>
    </div>

    <div class="right" id="nextBlock"></div>
  </div>

  <script>
    // Colori per categoria (palette Notion)
    const COLORS = {
      cantiere: "#e16259",
      deep: "#2383e2",
      ufficio: "#0f7b6c",
      riunione: "#9065b0",
      sopralluoghi: "#dfab01",
      feedback: "#d9730d",
      puffer: "#787774",
      prep: "#ad1a72"
    };

    // Settimana Ideale (1 = Lun, 2 = Mar, 3 = Mer, 4 = Gio, 5 = Ven, 6 = Sab, 0 = Dom)
    const SCHEDULE = {
      1: [
        { start: "07:00", end: "07:30", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "07:30", end: "09:30", title: "Deep working", color: COLORS.deep },
        { start: "09:30", end: "10:30", title: "Riunione Ufficio", color: COLORS.riunione },
        { start: "10:30", end: "11:30", title: "Riunione Cantiere", color: COLORS.riunione },
        { start: "11:30", end: "13:00", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio },
        { start: "14:30", end: "16:00", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio }
      ],
      2: [
        { start: "07:00", end: "07:30", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "07:30", end: "10:00", title: "Deep working", color: COLORS.deep },
        { start: "10:00", end: "12:00", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio },
        { start: "12:00", end: "13:00", title: "Sopralluoghi", color: COLORS.sopralluoghi },
        { start: "14:30", end: "16:00", title: "Deep working", color: COLORS.deep }
      ],
      3: [
        { start: "07:00", end: "07:30", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "07:30", end: "10:00", title: "Deep working", color: COLORS.deep },
        { start: "10:00", end: "11:30", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio },
        { start: "11:30", end: "12:30", title: "Sopralluoghi", color: COLORS.sopralluoghi },
        { start: "12:30", end: "13:00", title: "Feedback Anna + Mattia", color: COLORS.feedback },
        { start: "14:30", end: "16:00", title: "Puffer", color: COLORS.puffer }
      ],
      4: [
        { start: "07:00", end: "07:30", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "07:30", end: "10:30", title: "Deep working", color: COLORS.deep },
        { start: "10:30", end: "12:00", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio },
        { start: "12:00", end: "12:30", title: "Feedback a Thomas", color: COLORS.feedback },
        { start: "12:30", end: "13:00", title: "Sopralluoghi", color: COLORS.sopralluoghi },
        { start: "14:30", end: "17:00", title: "Deep working", color: COLORS.deep }
      ],
      5: [
        { start: "07:00", end: "07:30", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "07:30", end: "10:30", title: "Deep working", color: COLORS.deep },
        { start: "10:30", end: "11:30", title: "Jour fix", color: COLORS.riunione },
        { start: "11:30", end: "13:00", title: "Lavoro d'ufficio (mail, d3, tel, riunioni...)", color: COLORS.ufficio },
        { start: "14:00", end: "15:00", title: "Presenza in cantiere", color: COLORS.cantiere },
        { start: "15:00", end: "16:00", title: "Prep sett prox", color: COLORS.prep }
      ],
      6: [],
      0: []
    };

    function toMinutes(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      return h * 60 + m;
    }

    function updateBanner() {
      const now = new Date();
      const day = now.getDay();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const blocks = SCHEDULE[day] || [];

      const active = blocks.find(b => currentMin >= toMinutes(b.start) && currentMin < toMinutes(b.end));
      const next = blocks.find(b => toMinutes(b.start) > currentMin);

      const dotEl = document.getElementById("dot");
      const titleEl = document.getElementById("currentTitle");
      const timeEl = document.getElementById("currentTime");
      const fillEl = document.getElementById("progressFill");
      const pctEl = document.getElementById("pct");
      const nextEl = document.getElementById("nextBlock");

      if (active) {
        const startM = toMinutes(active.start);
        const endM = toMinutes(active.end);
        const pct = Math.min(100, Math.max(0, Math.round(((currentMin - startM) / (endM - startM)) * 100)));

        dotEl.style.background = active.color;
        fillEl.style.background = active.color;
        titleEl.textContent = active.title;
        timeEl.textContent = `${active.start} – ${active.end}`;
        fillEl.style.width = `${pct}%`;
        pctEl.textContent = `${pct}%`;
      } else {
        const isLunch = day >= 1 && day <= 5 && currentMin >= toMinutes("13:00") && currentMin < toMinutes(day === 5 ? "14:00" : "14:30");
        dotEl.style.background = "#9b9a97";
        fillEl.style.background = "#9b9a97";
        titleEl.textContent = isLunch ? "Pausa pranzo" : "Fuori fascia / Tempo libero";
        timeEl.textContent = now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
        fillEl.style.width = "0%";
        pctEl.textContent = "—";
      }

      if (next) {
        nextEl.innerHTML = `Prossimo: <strong>${next.start}</strong> ${next.title}`;
      } else {
        nextEl.textContent = "Nessun altro blocco oggi";
      }
    }

    updateBanner();
    setInterval(updateBanner, 30000);
  </script>
</body>
</html>
